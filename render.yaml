services:
  - type: web
    name: brucs-catalogo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/spot/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_KEY
        sync: false
      - key: SPOT_BASE
        value: https://ws.spotgifts.com.br/api/v1SSL/
      - key: SPOT_CATALOG_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.brucspersonalizados.com.br
      - key: ORDER_ADMIN_KEY
        sync: false
