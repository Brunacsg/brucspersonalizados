<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo Brucs 2026-2027 de brindes personalizados.">
    <title>Catálogo Brucs 2026-2027</title>
    <link rel="icon" href="../assets/images/logo.jpg" type="image/jpeg">
    <style>
        :root {
            --ink: #25193a;
            --surface: #fffdfa;
            --accent: #df8c31;
            --line: #ded6cf;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--ink);
            background: #f3eee8;
            font-family: Georgia, "Times New Roman", serif;
        }

        .catalog-header {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 12px clamp(18px, 4vw, 64px);
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: inherit;
            text-decoration: none;
        }

        .brand img {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand strong,
        .brand span { display: block; }

        .brand strong {
            font-size: 1.05rem;
            letter-spacing: .04em;
        }

        .brand span {
            margin-top: 2px;
            color: #695d74;
            font-family: Arial, sans-serif;
            font-size: .78rem;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Arial, sans-serif;
        }

        .button {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid var(--ink);
            border-radius: 4px;
            color: var(--ink);
            background: transparent;
            font-size: .88rem;
            font-weight: 700;
            text-decoration: none;
        }

        .button-primary {
            border-color: var(--accent);
            color: #fff;
            background: var(--accent);
        }

        main {
            width: min(100%, 1480px);
            margin: 0 auto;
            padding: clamp(18px, 3vw, 42px);
        }

        .intro {
            max-width: 760px;
            margin: 0 auto 22px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.75rem, 4vw, 3rem);
            letter-spacing: .02em;
        }

        .intro p {
            margin: 10px 0 0;
            color: #645b6e;
            font-family: Arial, sans-serif;
            line-height: 1.55;
        }

        .viewer {
            height: calc(100vh - 210px);
            min-height: 520px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: #fff;
            box-shadow: 0 14px 36px rgba(37, 25, 58, .13);
        }

        .viewer iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 600px) {
            .catalog-header { align-items: flex-start; }
            .actions .button:not(.button-primary) { display: none; }
            .viewer { height: calc(100vh - 188px); min-height: 430px; }
        }
    </style>
</head>
<body>
    <header class="catalog-header">
        <a class="brand" href="../index.html" aria-label="Voltar para o site Brucs">
            <img src="../assets/images/logo.jpg" alt="Brucs Personalizados">
            <span><strong>BRUCS</strong><span>Personalizados</span></span>
        </a>
        <nav class="actions" aria-label="Ações do catálogo">
            <a class="button" href="../index.html">Voltar ao site</a>
            <a class="button button-primary" href="https://media.githubusercontent.com/media/Brunacsg/brucspersonalizados/main/Downloads/Catalogo%20BRUCS%202026-27%20(1).pdf" target="_blank" rel="noopener noreferrer">Baixar PDF</a>
        </nav>
    </header>

    <main>
        <section class="intro" aria-labelledby="catalog-title">
            <h1 id="catalog-title">Catálogo Brucs 2026-2027</h1>
            <p>Conheça nossa seleção de brindes personalizados para marcas, equipes e eventos.</p>
        </section>
        <section class="viewer" aria-label="Visualizador do Catálogo Brucs 2026-2027">
            <iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https%3A%2F%2Fmedia.githubusercontent.com%2Fmedia%2FBrunacsg%2Fbrucspersonalizados%2Fmain%2FDownloads%2FCatalogo%2520BRUCS%25202026-27%2520%281%29.pdf" title="Catálogo Brucs 2026-2027">
                <p>Seu navegador não consegue exibir o PDF. <a href="https://media.githubusercontent.com/media/Brunacsg/brucspersonalizados/main/Downloads/Catalogo%20BRUCS%202026-27%20(1).pdf">Baixe o catálogo</a>.</p>
            </iframe>
        </section>
    </main>
</body>
</html>
