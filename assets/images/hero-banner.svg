<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo com gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c3483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Brindes ilustrativos -->
  <!-- Garrafa 1 -->
  <rect x="100" y="150" width="80" height="200" rx="8" fill="#fff" opacity="0.9"/>
  <ellipse cx="140" cy="140" rx="40" ry="18" fill="#f8f8f8"/>
  <rect x="125" y="120" width="30" height="25" rx="3" fill="#6c3483" opacity="0.8"/>
  <rect x="110" y="200" width="60" height="60" fill="#2d1b4e" opacity="0.15"/>
  
  <!-- Caneca 1 -->
  <g transform="translate(280, 200)">
    <rect x="0" y="0" width="100" height="90" rx="5" fill="#fff" opacity="0.85"/>
    <circle cx="100" cy="30" r="20" fill="none" stroke="#fff" stroke-width="12"/>
    <rect x="10" y="35" width="80" height="40" fill="#2d1b4e" opacity="0.1"/>
  </g>
  
  <!-- Squeeze -->
  <g transform="translate(450, 150)">
    <path d="M 20 40 L 15 150 Q 15 165 30 165 L 70 165 Q 85 165 85 150 L 80 40 Z" fill="#fff" opacity="0.9"/>
    <ellipse cx="50" cy="35" rx="25" ry="12" fill="#f8f8f8"/>
    <rect x="40" y="20" width="20" height="18" rx="2" fill="#6c3483" opacity="0.7"/>
  </g>
  
  <!-- Chaveiro -->
  <g transform="translate(700, 180)">
    <circle cx="0" cy="0" r="40" fill="#fff" opacity="0.85"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#6c3483" stroke-width="3"/>
    <line x1="0" y1="40" x2="0" y2="90" stroke="#fff" stroke-width="5" opacity="0.9"/>
    <circle cx="-15" cy="105" r="10" fill="#fff" opacity="0.8"/>
    <circle cx="15" cy="105" r="10" fill="#fff" opacity="0.8"/>
  </g>
  
  <!-- Ecobag -->
  <g transform="translate(920, 150)">
    <path d="M 20 50 L 30 10 L 70 10 L 80 50 L 80 140 Q 80 155 65 155 L 35 155 Q 20 155 20 140 Z" fill="#fff" opacity="0.9"/>
    <line x1="30" y1="50" x2="70" y2="50" stroke="#2d1b4e" stroke-width="5" opacity="0.7"/>
    <line x1="28" y1="25" x2="18" y2="50" stroke="#6c3483" stroke-width="3" opacity="0.8"/>
    <line x1="72" y1="25" x2="82" y2="50" stroke="#6c3483" stroke-width="3" opacity="0.8"/>
  </g>
</svg>